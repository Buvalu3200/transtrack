<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransTrack - Sistema de Gestión de Flotas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .nav-tab {
            background: #f8f9fa;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: #667eea;
        }

        .nav-tab:hover {
            background: #e9ecef;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .map-container {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: 500px;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .voice-assistant {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .voice-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .voice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        .voice-btn.listening {
            background: #ff4757;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .vehicles-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .vehicle-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #28a745;
        }

        .vehicle-item.warning {
            border-left-color: #ffc107;
        }

        .vehicle-item.alert {
            border-left-color: #dc3545;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.warning {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.alert {
            background: #f8d7da;
            color: #721c24;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #764ba2;
        }

        .response-box {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            min-height: 40px;
            font-style: italic;
        }

        .admin-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 15px;
            text-align: left;
            background: #f8f9fa;
            color: #667eea;
            font-weight: bold;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .btn-edit {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🚛 TransTrack</h1>
                <p class="subtitle">Sistema Inteligente de Gestión y Monitoreo de Flotas</p>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showSection('monitor')">📍 Monitoreo</button>
                <button class="nav-tab" onclick="showSection('admin')">⚙️ Administración</button>
            </div>
        </header>

        <div id="monitor-section" class="section active">
            <div class="main-grid">
                <div class="map-container">
                    <div id="map"></div>
                </div>

                <div class="control-panel">
                    <div class="voice-assistant">
                        <h3>🎤 Asistente de Voz</h3>
                        <button class="voice-btn" id="voiceBtn">🎙️ Activar Voz</button>
                        <div id="statusText" style="margin-top:10px; font-size:13px;"></div>
                        <div class="response-box" id="responseBox"></div>
                    </div>

                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-number" id="activeVehicles">0</div>
                            <div class="stat-label">Vehículos Activos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="totalAlerts">0</div>
                            <div class="stat-label">Alertas Abiertas</div>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 10px; color: #667eea;">Vehículos</h3>
                    <div class="vehicles-list" id="vehiclesList"></div>

                    <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                        <h4 style="margin-bottom: 10px;">🎮 Controles</h4>
                        <button class="control-btn" onclick="simulateAlert()">Simular Alerta</button>
                        <button class="control-btn" onclick="centerMap()">Centrar Mapa</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="admin-section" class="section">
            <div class="admin-section">
                <div class="admin-header">
                    <h2>🚗 Gestión de Vehículos</h2>
                    <button class="btn-primary" onclick="openModal()">➕ Agregar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Conductor</th>
                            <th>Estado</th>
                            <th>Velocidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="vehicleModal">
        <div class="modal-content">
            <h2 id="modalTitle">Agregar Vehículo</h2>
            <form id="vehicleForm" onsubmit="saveVehicle(event)">
                <input type="hidden" id="vehicleId">
                
                <div class="form-group">
                    <label>Placa</label>
                    <input type="text" id="plate" required>
                </div>

                <div class="form-group">
                    <label>Conductor</label>
                    <input type="text" id="driver" required>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select id="status">
                        <option value="active">Operativo</option>
                        <option value="warning">Detenido</option>
                        <option value="alert">Alerta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Velocidad (km/h)</label>
                    <input type="number" id="speed" min="0" max="120" value="40">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        let vehicles = [
            { id: 1, plate: 'ABC-123', driver: 'Carlos Pérez', status: 'active', lat: 3.4516, lon: -76.5320, speed: 45 },
            { id: 2, plate: 'DEF-456', driver: 'María González', status: 'warning', lat: 3.4372, lon: -76.5225, speed: 0 },
            { id: 3, plate: 'GHI-789', driver: 'Juan Rodríguez', status: 'alert', lat: 3.4210, lon: -76.5500, speed: 85 },
            { id: 4, plate: 'JKL-012', driver: 'Ana Martínez', status: 'active', lat: 3.4650, lon: -76.5150, speed: 50 }
        ];

        let nextId = 5;
        let map;
        const markers = {};

        function initMap() {
            map = L.map('map').setView([3.4516, -76.5320], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            updateMap();
        }

        function getMarkerIcon(status) {
            const colors = { active: '#28a745', warning: '#ffc107', alert: '#dc3545' };
            return L.divIcon({
                html: `<div style="background: ${colors[status]}; width: 30px; height: 30px; border-radius: 50%; border: 3px solid white;"></div>`,
                className: '',
                iconSize: [30, 30]
            });
        }

        function updateMap() {
            Object.values(markers).forEach(m => map.removeLayer(m));
            vehicles.forEach(v => {
                const marker = L.marker([v.lat, v.lon], { icon: getMarkerIcon(v.status) }).addTo(map);
                marker.bindPopup(`<b>${v.plate}</b><br>${v.driver}<br>${v.speed} km/h`);
                markers[v.id] = marker;
            });
        }

        function updateVehiclesList() {
            const list = document.getElementById('vehiclesList');
            list.innerHTML = vehicles.map(v => `
                <div class="vehicle-item ${v.status}">
                    <div><strong>${v.plate}</strong><br><small>${v.driver} • ${v.speed} km/h</small></div>
                    <span class="status-badge ${v.status}">${v.status === 'active' ? 'OK' : v.status === 'warning' ? 'Detenido' : 'Alerta'}</span>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('activeVehicles').textContent = vehicles.filter(v => v.status === 'active').length;
            document.getElementById('totalAlerts').textContent = vehicles.filter(v => v.status === 'alert').length;
        }

        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = vehicles.map(v => `
                <tr>
                    <td><strong>${v.plate}</strong></td>
                    <td>${v.driver}</td>
                    <td><span class="status-badge ${v.status}">${v.status === 'active' ? 'OK' : v.status === 'warning' ? 'Detenido' : 'Alerta'}</span></td>
                    <td>${v.speed} km/h</td>
                    <td>
                        <button class="btn-edit" onclick="editVehicle(${v.id})">✏️</button>
                        <button class="btn-delete" onclick="deleteVehicle(${v.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`${section}-section`).classList.add('active');
            event.target.classList.add('active');
            if (section === 'admin') updateTable();
        }

        function openModal(vehicleId = null) {
            const modal = document.getElementById('vehicleModal');
            const form = document.getElementById('vehicleForm');
            form.reset();
            
            if (vehicleId) {
                const v = vehicles.find(x => x.id === vehicleId);
                document.getElementById('modalTitle').textContent = 'Editar Vehículo';
                document.getElementById('vehicleId').value = v.id;
                document.getElementById('plate').value = v.plate;
                document.getElementById('driver').value = v.driver;
                document.getElementById('status').value = v.status;
                document.getElementById('speed').value = v.speed;
            } else {
                document.getElementById('modalTitle').textContent = 'Agregar Vehículo';
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('vehicleModal').classList.remove('active');
        }

        function saveVehicle(e) {
            e.preventDefault();
            const id = document.getElementById('vehicleId').value;
            const data = {
                plate: document.getElementById('plate').value,
                driver: document.getElementById('driver').value,
                status: document.getElementById('status').value,
                speed: parseInt(document.getElementById('speed').value),
                lat: 3.4516 + (Math.random() - 0.5) * 0.05,
                lon: -76.5320 + (Math.random() - 0.5) * 0.05
            };
            
            if (id) {
                const index = vehicles.findIndex(v => v.id === parseInt(id));
                vehicles[index] = { ...vehicles[index], ...data };
            } else {
                vehicles.push({ id: nextId++, ...data });
            }
            
            updateAll();
            closeModal();
        }

        function editVehicle(id) {
            openModal(id);
        }

        function deleteVehicle(id) {
            const v = vehicles.find(x => x.id === id);
            if (confirm(`¿Eliminar ${v.plate}?`)) {
                vehicles = vehicles.filter(x => x.id !== id);
                updateAll();
            }
        }

        function simulateAlert() {
            const v = vehicles[Math.floor(Math.random() * vehicles.length)];
            v.status = 'alert';
            v.speed = 90;
            updateAll();
            speak(`Alerta en vehículo ${v.plate}`);
        }

        function centerMap() {
            const avgLat = vehicles.reduce((s, v) => s + v.lat, 0) / vehicles.length;
            const avgLon = vehicles.reduce((s, v) => s + v.lon, 0) / vehicles.length;
            map.setView([avgLat, avgLon], 13);
        }

        function updateAll() {
            updateMap();
            updateVehiclesList();
            updateStats();
            updateTable();
        }

        function speak(text) {
            document.getElementById('responseBox').textContent = text;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                speechSynthesis.speak(utterance);
            }
        }

        // Voz
        const voiceBtn = document.getElementById('voiceBtn');
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                if (cmd.includes('estado')) {
                    speak(`Hay ${vehicles.filter(v => v.status === 'active').length} vehículos operativos`);
                } else if (cmd.includes('alerta')) {
                    speak(`Hay ${vehicles.filter(v => v.status === 'alert').length} alertas activas`);
                } else {
                    speak('No entendí el comando');
                }
            };
            voiceBtn.onclick = () => recognition.start();
        }

        // Movimiento
        setInterval(() => {
            vehicles.forEach(v => {
                if (v.status === 'active') {
                    v.lat += (Math.random() - 0.5) * 0.003;
                    v.lon += (Math.random() - 0.5) * 0.003;
                    v.speed = 40 + Math.floor(Math.random() * 30);
                }
            });
            updateMap();
            updateVehiclesList();
        }, 3000);

        // Iniciar
        window.onload = () => {
            initMap();
            updateAll();
        };
    </script>
</body>
</html>
